name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed scopes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/07-api-contract.md'
            frontend:
              - 'frontend/**'
              - 'docs/07-api-contract.md'
            contracts:
              - 'contracts/**'
              - 'docs/06-smart-contract-spec.md'
            docs:
              - 'docs/**'
              - 'README.md'

  backend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: urbanchain
          MYSQL_USER: urbanchain
          MYSQL_PASSWORD: urbanchain
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://urbanchain:urbanchain@127.0.0.1:3307/urbanchain
      JWT_SECRET: ci-secret
      NODE_ENV: test
      BLOCKCHAIN_SYNC_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run DB migrations
        run: npm run db:migrate

      - name: Seed DB
        run: npm run db:seed

      - name: Lint backend
        run: npm run lint:backend

      - name: Build backend
        run: npm --workspace backend run build

      - name: Test backend
        run: npm --workspace backend run test

      - name: Test backend RPC smoke (fail hard)
        env:
          BLOCKCHAIN_SYNC_MODE: rpc
          BLOCKCHAIN_CHAIN_ID: ${{ secrets.S4_BLOCKCHAIN_CHAIN_ID || secrets.BLOCKCHAIN_CHAIN_ID }}
          RPC_URL: ${{ secrets.S4_RPC_URL || secrets.RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.S4_CONTRACT_ADDRESS || secrets.CONTRACT_ADDRESS }}
          CHAIN_SIGNER_PRIVATE_KEY: ${{ secrets.S4_CHAIN_SIGNER_PRIVATE_KEY || secrets.CHAIN_SIGNER_PRIVATE_KEY || secrets.PRIVATE_KEY }}
        run: npm --workspace backend run test:rpc

  frontend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Build frontend
        run: npm --workspace frontend run build

      - name: Test frontend
        run: npm --workspace frontend run test

  contracts-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm --workspace contracts run build

      - name: Test contracts
        run: npm --workspace contracts run test

  docs-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required docs
        run: |
          test -f docs/04-backlog-mvp.md
          test -f docs/06-smart-contract-spec.md
          test -f docs/07-api-contract.md
          test -f docs/08-definition-of-done.md
          test -f README.md
